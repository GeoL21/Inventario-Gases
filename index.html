<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F7">
<meta name="description" content="Inventario de material de gases medicinales. Funciona sin señal.">
<title>Inventario Gases Medicinales</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=20261117">
<link rel="apple-touch-icon" href="icon-192.png?v=20261117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Plus Jakarta Sans";src:url("PlusJakartaSans.ttf") format("truetype");font-weight:200 800;font-display:swap}
:root{
  --vino:#6A1B3A;--vino-osc:#4E1229;--vino-suave:#F7EEF2;--vino-medio:#EADCE1;
  --fondo:#FBF8F9;--tarjeta:#fff;--tinta:#1F2937;--suave:#4B5563;--linea:#E0CDD3;--linea-suave:#EFE4E8;
  --ok:#1C7A4C;--ok-txt:#17663F;--ok-suave:#E5F3EC;
  --alerta:#A8540A;--alerta-txt:#8A4508;--alerta-suave:#FDF0DF;--alerta-linea:#F2D3A8;
  --rojo:#B3261E;--rojo-txt:#9B1F18;--rojo-suave:#FBE9E7;--rojo-linea:#F1C3BE;
  --radio:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fondo);color:var(--tinta);
  font:16px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100dvh;overscroll-behavior-y:contain}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid #C98AA3;outline-offset:2px}
.oculto{display:none!important}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.i-s{width:16px;height:16px}.i.i-m{width:18px;height:18px}.i.i-l{width:36px;height:36px;stroke-width:1.6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:640px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
#vista{flex:1;display:flex;flex-direction:column}
.cuerpo{padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.cuerpo.con-barra{padding-bottom:calc(110px + env(safe-area-inset-bottom))}

/* Encabezado */
.cab{position:sticky;top:0;z-index:5;background:#fff;color:var(--tinta);border-bottom:1px solid var(--linea-suave);padding:calc(10px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:10px}
.cab .fila{display:flex;align-items:center;gap:10px}
.cab .logo{width:42px;height:42px;border-radius:50%;background:#fff;flex:none;object-fit:cover;border:2px solid var(--vino);padding:1px}
.cab h1{font-size:18px;font-weight:800;line-height:1.2;color:var(--vino)}
.cab small{display:block;font-size:13px;color:var(--suave);font-weight:500}
.cab .tit{flex:1;min-width:0}
.btn-cab{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--linea-suave);background:#fff;color:var(--vino);display:grid;place-items:center;flex:none}
.btn-cab.txt{width:auto;padding:0 12px;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center}
.buscar{display:flex;align-items:center;gap:10px;background:#fff;color:var(--suave);border:1.5px solid var(--linea);border-radius:12px;padding:0 6px 0 12px;min-height:46px}
.buscar:focus-within{border-color:var(--vino);box-shadow:0 0 0 3px var(--vino-suave)}
.solo-pc{display:none}
.buscar input{border:0;outline:0;flex:1;font-size:16px;color:var(--tinta);background:transparent;min-width:0;padding:12px 0}
.buscar button{width:40px;height:40px;border:0;background:none;color:var(--suave);display:grid;place-items:center;border-radius:10px}

/* Franja de sincronización */
.franja{display:flex;align-items:center;gap:8px;margin:10px 16px 0;padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600;line-height:1.35}
.franja.ok{align-self:flex-start;border-radius:20px;padding:6px 12px}
.cab .franja{margin:0}
.franja.ok{background:var(--ok-suave);color:var(--ok-txt)}
.franja.espera{background:var(--alerta-suave);color:var(--alerta-txt)}
.franja.sube{background:var(--vino-suave);color:var(--vino)}
.franja.error{background:var(--rojo-suave);color:var(--rojo-txt)}
.franja span{flex:1}
.franja button{border:0;background:rgba(0,0,0,.07);color:inherit;font-weight:700;font-size:13px;border-radius:8px;min-height:36px;padding:0 10px}

/* Tarjetas y filas */
.tarjeta{background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio)}
.resumen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cifra .ic{display:none}
.cifra.pend{display:none}
.cifra{border:1px solid var(--linea);background:#fff;border-radius:16px;padding:10px 12px;text-align:left;min-height:64px}
.cifra b{display:block;font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.cifra span{font-size:12px;font-weight:700;color:var(--suave)}
.cifra.bajo b{color:var(--alerta-txt)}
.cifra.agot b{color:var(--rojo-txt)}
.cifra.pend b{color:var(--alerta-txt)}
.cifra[aria-pressed="true"]{outline:2px solid var(--vino);outline-offset:-1px}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 2px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex:none}
.chip[aria-pressed="true"]{background:var(--vino);border-color:var(--vino);color:#fff;font-weight:700}
.chip .n{font-size:12px;font-weight:800;background:rgba(0,0,0,.08);border-radius:999px;padding:1px 7px}
.chip[aria-pressed="true"] .n{background:rgba(255,255,255,.22)}

.seccion{font-size:15px;font-weight:800;color:var(--tinta);margin:8px 2px -2px;display:flex;gap:8px;align-items:baseline}
.seccion small{font-size:12.5px;font-weight:600;color:var(--suave)}
.lista{display:flex;flex-direction:column;gap:8px}
.art{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:10px 14px 10px 14px;min-height:68px;width:100%;text-align:left;position:relative;overflow:hidden}
.art::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--ok)}
.art.e-bajo::before{background:var(--alerta)}.art.e-agot::before{background:var(--rojo)}
.art .est{font-size:12px;font-weight:700;color:var(--ok-txt)}
.art.e-bajo .est,.art.e-bajo .cant b{color:var(--alerta-txt)}.art.e-agot .est,.art.e-agot .cant b{color:var(--rojo-txt)}
.foto-mini{width:48px;height:48px;border-radius:10px;background:var(--vino-suave);color:var(--vino);display:grid;place-items:center;flex:none;overflow:hidden}
.foto-mini img{width:100%;height:100%;object-fit:cover}
.art .txt{flex:1;min-width:0}
.art .nom{font-size:15px;font-weight:700;line-height:1.25}
.art .sub{font-size:13px;color:var(--suave);margin-top:2px}
.art .der{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.cant{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.cant b{font-size:22px;font-weight:800}
.cant small{font-size:12px;font-weight:600;color:var(--suave)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.agot{background:var(--rojo-suave);color:var(--rojo-txt)}
.tag.bajo{background:var(--alerta-suave);color:var(--alerta-txt)}
.tag.ok{background:var(--ok-suave);color:var(--ok-txt)}
.tag.neutro{background:var(--vino-suave);color:var(--vino)}
.tag.gris{background:#ECEAEB;color:var(--suave)}

.vacio{text-align:center;padding:36px 16px;color:var(--suave);display:flex;flex-direction:column;align-items:center;gap:10px}
.vacio b{color:var(--tinta);font-size:16px}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--linea);padding:0 6px env(safe-area-inset-bottom)}
.nav .in{max-width:640px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--suave);background:none;border:0;min-height:60px;position:relative;text-decoration:none}
.tab[aria-current="page"]{color:var(--vino);font-weight:800}
.tab .mas{width:46px;height:46px;margin-top:-20px;border-radius:14px;background:var(--vino);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(106,27,58,.3)}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--alerta);color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 6px;min-width:20px;text-align:center}
.marca,.pie-nav{display:none}

/* Botones */
.btn{min-height:52px;border-radius:12px;border:0;background:var(--vino);color:#fff;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn:active{background:var(--vino-osc)}
.btn.sec{background:#fff;color:var(--vino);border:1.5px solid var(--vino)}
.btn.verde{background:var(--ok)}
.btn.peligro{background:#fff;color:var(--rojo);border:1.5px solid var(--rojo-linea)}
.btn.chico{min-height:44px;font-size:14px;border-radius:10px;padding:0 10px}
a.btn{text-decoration:none}
.error:empty,.ayuda:empty{display:none}
.btn.ancho{width:100%}
.barra-inf{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--linea);padding:12px 16px calc(14px + env(safe-area-inset-bottom))}
.barra-inf .in{max-width:608px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px}

/* Detalle */
.foto-grande{position:relative;height:220px;border-radius:16px;overflow:hidden;background:var(--vino-medio);border:1.5px dashed #C9A5B2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--vino)}
.foto-grande.con{border:0;background:#ddd}
.foto-grande img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-grande .acciones{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.foto-grande .acciones .btn{min-height:40px;font-size:13px;padding:0 12px;border-radius:10px;background:rgba(31,41,55,.78)}
.kicker{font-size:13px;font-weight:800;color:var(--vino);text-transform:uppercase;letter-spacing:.04em}
.titulo-art{font-size:22px;font-weight:800;line-height:1.2;margin-top:2px}
.datos3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dato{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:10px 12px;text-align:left;min-height:68px}
.dato span{display:block;font-size:12px;color:var(--suave);font-weight:600}
.dato b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.dato b small{font-size:13px;color:var(--suave);font-weight:600}
.dato.editable{border-style:dashed;border-color:#C9A5B2}
.dato.editable span{display:flex;align-items:center;gap:4px;color:var(--vino)}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.aviso.agot{background:var(--rojo-suave);color:var(--rojo-txt)}
.aviso.bajo{background:var(--alerta-suave);color:var(--alerta-txt)}
.aviso.info{background:var(--vino-suave);color:var(--vino)}
.movs{padding:4px 14px}
.movs h2{font-size:15px;font-weight:800;padding:10px 0 4px}
.mov{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linea-suave);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.mov .ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.ico.retiro{background:var(--vino-suave);color:var(--vino)}
.ico.pend{background:var(--alerta-suave);color:var(--alerta-txt)}
.ico.entra{background:var(--ok-suave);color:var(--ok-txt)}
.ico.anul{background:#ECEAEB;color:var(--suave)}
.mov .txt{flex:1;min-width:0}
.mov .d{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mov .m{font-size:12px;color:var(--suave)}
.mov .q{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.mov .q.mas{color:var(--ok-txt)}
.mov.anulado .d,.mov.anulado .q{text-decoration:line-through;color:var(--suave)}

/* Formulario */
.campo{display:flex;flex-direction:column;gap:6px}
.lbl{font-size:14px;font-weight:600;color:var(--suave)}
.inp{width:100%;min-height:48px;border:1.5px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff;color:var(--tinta)}
textarea.inp{min-height:72px;resize:vertical}
.inp:focus{border-color:var(--vino);outline:0;box-shadow:0 0 0 3px var(--vino-suave)}
.inp[aria-invalid="true"]{border-color:var(--rojo)}
.error{font-size:13px;font-weight:700;color:var(--rojo-txt);display:flex;gap:6px;align-items:center}
.ayuda{font-size:13px;color:var(--suave)}
.ayuda.alerta{color:var(--alerta-txt);font-weight:700}
.ayuda.mal{color:var(--rojo-txt);font-weight:700}
.segmento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--vino-medio);padding:4px;border-radius:14px}
.segmento button{min-height:44px;border:0;border-radius:10px;background:transparent;color:#4B2A36;font-size:14px;font-weight:700}
.segmento button[aria-checked="true"]{background:var(--vino);color:#fff;font-weight:800}
.dos{display:grid;grid-template-columns:110px minmax(0,1fr);gap:10px}
.opciones{display:flex;flex-wrap:wrap;gap:6px}
.opcion{min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.opcion[aria-pressed="true"],.opcion[aria-checked="true"]{background:var(--vino);border-color:var(--vino);color:#fff;font-weight:700}
.estado2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.estado2 button{min-height:48px;border-radius:12px;border:1.5px solid var(--linea);background:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}
.estado2 button.pend[aria-checked="true"]{border:2px solid var(--alerta);background:var(--alerta-suave);color:var(--alerta-txt);font-weight:800}
.estado2 button.inst[aria-checked="true"]{border:2px solid var(--ok);background:var(--ok-suave);color:var(--ok-txt);font-weight:800}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--vino)}
.items{padding:4px 12px 8px}
.items .top{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.items .top b{font-size:15px;font-weight:800}
.linea{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--linea-suave)}
.linea .txt{flex:1;min-width:0}
.linea .nom{font-size:14px;font-weight:700;line-height:1.25}
.paso{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--linea);background:#fff;color:var(--vino);display:grid;place-items:center;flex:none}
.num{width:56px;min-height:40px;border:1.5px solid var(--linea);border-radius:10px;text-align:center;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px}
.num[aria-invalid="true"]{border-color:var(--rojo);color:var(--rojo-txt)}
.quitar{width:36px;height:40px;border:0;background:none;color:var(--suave);display:grid;place-items:center;flex:none}
.agregar{min-height:40px;padding:0 12px;border-radius:10px;border:0;background:var(--vino-suave);color:var(--vino);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}

/* Pendientes / historial */
.tk{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tk .cab2{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;text-align:left;width:100%}
.tk .cab2 .txt{flex:1;min-width:0}
.tk .d{font-size:15px;font-weight:800}
.tk .m{font-size:13px;color:var(--suave);margin-top:2px}
.tk .its{font-size:13px;line-height:1.45}
.tk .bts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fecha-sec{font-size:13px;font-weight:800;color:var(--suave);margin:8px 2px -2px}
.hist{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);padding:10px 12px;width:100%;text-align:left;min-height:64px}
.hist .txt{flex:1;min-width:0}
.hist .d{font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .m{font-size:13px;color:var(--suave)}
.hist.anulado .d{text-decoration:line-through;color:var(--suave)}

/* Hoja inferior (modales) */
.velo{position:fixed;inset:0;z-index:20;background:rgba(31,20,25,.45);display:flex;align-items:flex-end;justify-content:center;animation:aparece .18s var(--ease-out)}
.hoja{background:#fff;width:100%;max-width:640px;max-height:88dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sube .22s var(--ease-out);padding-bottom:env(safe-area-inset-bottom)}
.hoja .agarre{width:40px;height:4px;border-radius:4px;background:#D9CCD1;margin:8px auto 0}
.hoja .h-cab{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--linea-suave)}
.hoja .h-cab h2{flex:1;font-size:17px;font-weight:800}
.hoja .h-cab button{width:44px;height:44px;border:0;background:var(--fondo);border-radius:12px;display:grid;place-items:center}
.hoja .h-cuerpo{overflow-y:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:12px}
.hoja .h-pie{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:10px;padding:12px 16px 16px;border-top:1px solid var(--linea-suave)}
.menu-op{display:flex;align-items:center;gap:12px;min-height:56px;width:100%;background:none;border:0;border-bottom:1px solid var(--linea-suave);font-size:15px;font-weight:700;text-align:left;padding:0 4px}
.menu-op .i{color:var(--vino)}
.menu-op small{display:block;font-size:12px;font-weight:500;color:var(--suave)}
.elegir{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;background:none;border:0;border-bottom:1px solid var(--linea-suave);text-align:left;padding:6px 0}
.elegir .txt{flex:1;min-width:0}
.elegir .nom{font-size:15px;font-weight:700}
.elegir .sub{font-size:12px;color:var(--suave)}
.elegir:disabled{opacity:.5}
.ficha{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px}
.ficha dt{color:var(--suave);font-weight:600}
.ficha dd{margin:0;font-weight:700}

/* Pantalla de acceso */
.acceso{position:fixed;inset:0;z-index:30;background:var(--fondo);display:flex;align-items:center;justify-content:center;padding:24px}
.acceso .caja{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px;text-align:center}
.acceso img{width:96px;height:96px;border-radius:50%;margin:0 auto}
.acceso h1{font-size:22px;font-weight:800}

/* Aviso flotante */
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;max-width:560px;margin:0 auto;background:#1F2937;color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:center;animation:sube .2s var(--ease-out)}

@keyframes sube{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes aparece{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* PC: pantalla completa (desde 1024 px) */
@media (min-width:1024px){
  #app{max-width:none}
  body:has(.nav) #app{padding-left:220px}
  .nav{top:0;bottom:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--linea);padding:16px 12px}
  .nav{display:flex;flex-direction:column}
  .nav .in{max-width:none;flex-direction:column;gap:4px}
  .marca{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
  .marca img{width:42px;height:42px;border-radius:50%;border:2px solid var(--vino);padding:1px;background:#fff;flex:none}
  .marca b{color:var(--vino);font-weight:800;font-size:14.5px;line-height:1.2}
  .pie-nav{display:block;margin-top:auto;font-size:11.5px;color:#9a8790;padding:0 8px;line-height:1.4}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:50px;padding:0 14px;border-radius:12px;font-size:15px}
  .tab:hover{background:var(--vino-suave)}
  .tab[aria-current="page"]{background:var(--vino-suave);color:var(--vino)}
  .tab:has(.mas){order:-1;background:var(--vino);color:#fff;font-weight:800;margin-bottom:12px;justify-content:center}
  .tab:has(.mas):hover{background:var(--vino-osc)}
  .tab .mas{width:auto;height:auto;margin:0;background:none;box-shadow:none;color:inherit}
  .tab .badge{position:static;margin-left:auto}
  .cab{position:static;padding:18px 28px 10px;flex-direction:row;align-items:center;gap:14px;border-bottom:0;background:transparent}
  .cab>.fila,.cab>.tit{flex:1;min-width:0}
  .cab .buscar{width:min(440px,36%);flex:none}
  .cab .logo{display:none}
  .cab h1{font-size:24px;color:var(--tinta)}
  .solo-pc{display:inline}.solo-cel{display:none}
  .franja{margin:12px 28px 0}
  .cab .franja{flex:none;margin:0}
  .cab .franja.ok{border-radius:20px}
  .cab.inv>.fila{display:contents}
  .cab.inv .tit{order:1;flex:1}.cab.inv .buscar{order:2}.cab.inv .franja{order:3}.cab.inv .btn-cab.txt{order:4}.cab.inv .btn-cab{order:5}
  .cuerpo{padding:22px 28px 40px}
  .cuerpo.con-barra{padding-bottom:110px}
  .chips{margin:0;padding:0 0 2px}
  .resumen{grid-template-columns:repeat(4,minmax(0,1fr))}
  .cifra{display:flex;align-items:center;gap:12px;padding:14px 16px}
  .cifra .ic{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;flex:none;background:var(--vino-suave);color:var(--vino)}
  .cifra.bajo .ic{background:var(--alerta-suave);color:var(--alerta-txt)}.cifra.agot .ic{background:var(--rojo-suave);color:var(--rojo-txt)}.cifra.pend .ic{background:var(--alerta-suave);color:var(--alerta-txt)}
  .cifra.pend{display:flex}
  .cifra b{font-size:26px}
  .lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;align-items:start}
  .seccion,.fecha-sec,.lista>.vacio{grid-column:1/-1}
  .seccion{margin:10px 2px 0}.fecha-sec{margin:10px 2px 0}
  .art:hover,.hist:hover,.cifra:hover{border-color:var(--vino)}
  .chip:hover,.opcion:hover{border-color:var(--vino)}
  /* Detalle del artículo: foto y datos a la izquierda, movimientos a la derecha */
  .cuerpo:has(>.foto-grande){display:grid;grid-template-columns:minmax(340px,460px) minmax(0,1fr);gap:14px 24px;align-items:start}
  .cuerpo:has(>.foto-grande)>*{grid-column:1}
  .cuerpo:has(>.foto-grande)>.movs{grid-column:2;grid-row:1/span 10}
  .foto-grande{height:300px}
  /* Nuevo movimiento: datos a la izquierda, artículos a la derecha */
  .cuerpo:has(>.items){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 24px;align-items:start}
  .cuerpo:has(>.items)>*{grid-column:1}
  .cuerpo:has(>.items)>.items{grid-column:2;grid-row:1/span 20}
  .dos{grid-template-columns:200px minmax(0,1fr)}
  .barra-inf{padding:12px 28px 14px}
  .barra-inf .in{max-width:none;display:flex;justify-content:flex-end}
  .barra-inf .btn{min-width:240px}
  body:has(.nav) .barra-inf{left:220px}
  /* Hojas como ventana centrada */
  .velo{align-items:center;padding:24px}
  .hoja{border-radius:20px;max-height:86vh}
  .hoja .agarre{display:none}
  .toast{bottom:24px}
}

/* ---------- Movimiento (skill motion) ---------- */
/* Botones: se encogen un poco al tocarlos (150 ms) para que se note la respuesta */
:root{--ease-out:cubic-bezier(0.23,1,0.32,1)}
button,.btn{transition:transform 150ms var(--ease-out)}
button:active:not(:disabled),.btn:active{transform:scale(.98)}
/* Palomita que se dibuja (guardado y sincronizado) */
.dibuja{stroke-dasharray:24;stroke-dashoffset:24;animation:dibuja 350ms var(--ease-out) 80ms forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
/* Nube que late mientras sube */
.late{animation:late 1.2s ease-in-out infinite}
@keyframes late{50%{opacity:.35;transform:translateY(-2px)}}
/* Contador de pendientes que salta cuando cambia */
.badge.salta{animation:salta 400ms var(--ease-out)}
@keyframes salta{30%{transform:scale(1.35)}}
/* Stock que cambió: destello */
.cant.cambio{border-radius:8px;animation:destello 1s var(--ease-out)}
@keyframes destello{0%{background:var(--vino-suave);box-shadow:0 0 0 4px var(--vino-suave)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
/* Foto recién subida: aparece suave */
.foto-mini img.nueva{animation:fundido 300ms var(--ease-out)}
@keyframes fundido{from{opacity:0;transform:scale(.92)}}
/* Con "reducir movimiento" activado en el teléfono: sin escalas */
@media (prefers-reduced-motion:reduce){button:active:not(:disabled),.btn:active{transform:none!important}}

/* ---------- Estándar visual (Material 3, estilo Mornye) – 16 nov 2026 ---------- */
:root{
  --vino:#8E4953;--vino-osc:#73343E;--vino-suave:#F8ECEC;--vino-medio:#F0DEDF;
  --fondo:#FFF8F7;--tarjeta:#F8ECEC;--tinta:#22191A;--suave:#534345;--linea:#D8C2C4;--linea-suave:#F0DEDF;
  --ok:#1B5E33;--ok-txt:#1B5E33;--ok-suave:#D3F0DC;
  --alerta:#7A4A00;--alerta-txt:#7A4A00;--alerta-suave:#FFF3DC;--alerta-linea:#F2D9AC;
  --rojo:#B3261E;--rojo-txt:#B3261E;--rojo-suave:#FCEBEA;--rojo-linea:#F2C4C0;
  --cont:#FFD9DD;--cont-txt:#3B0713;--verde-btn:#1E6B3E;
  --m3:cubic-bezier(.2,0,0,1);--m3in:cubic-bezier(.05,.7,.1,1);--radio:28px;
}
html,body{font-family:"Google Sans Flex","Roboto Flex",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline-color:var(--vino)}
.i.sello{stroke:none}

/* Encabezado estándar */
.cab.est{position:static;display:block;background:transparent;border:0;padding:calc(20px + env(safe-area-inset-top)) 24px 4px}
.cab.est .hrow{display:flex;align-items:center;justify-content:space-between}
.cab.est .volver{width:48px;height:48px;border-radius:24px;border:0;background:var(--linea-suave);color:var(--tinta);display:flex;align-items:center;justify-content:center;transition:transform 150ms var(--m3)}
.cab.est .volver:active{transform:scale(.94)}
.cab.est .volver .i{width:24px;height:24px}
.cab.est .hder{display:flex;align-items:center;gap:8px}
.cab.est .logo{width:48px;height:48px;border:0;padding:0;border-radius:0;background:none;object-fit:contain}
.cab.est .btn-cab{border:0;background:var(--linea-suave);color:var(--tinta);border-radius:24px;width:48px;height:48px}
.cab.est h1{margin:28px 0 6px;font-size:34px;line-height:42px;font-weight:700;letter-spacing:-.3px;color:var(--tinta)}
.cab.est .sub{margin:0;font-size:15px;color:var(--suave)}
.estado-fila{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;min-height:36px;flex-wrap:wrap}
.estado-fila .hora{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:18px;background:var(--tarjeta);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.estado-fila .hora .i{color:var(--vino)}
.cab.est .franja{margin:0;font-weight:500;flex:1 1 auto;min-width:0;border-radius:18px}
.cab.est .franja.ok{background:none;padding:0;flex:0 1 auto}
.cab.est .franja.espera,.cab.est .franja.error,.cab.est .franja.sube{flex-basis:100%;order:2}
.franja button{border-radius:16px;font-weight:600}
.cab.est .buscar{margin-top:18px;border:0;border-radius:28px;background:var(--linea-suave);min-height:56px;padding:0 8px 0 18px}
.cab.est .buscar:focus-within{box-shadow:0 0 0 3px var(--cont)}

/* Cuerpo, secciones y tarjetas */
.cuerpo{gap:10px;padding-top:14px}
.secc{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 8px 0;font-size:15px;font-weight:600;color:var(--vino)}
.tag{border-radius:13px;font-weight:600;height:26px;padding:0 10px}
.tag.listo:empty{display:none}
.tag.listo{animation:aparece2 350ms var(--m3in)}
@keyframes aparece2{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.tarjeta{border:0;border-radius:28px;background:var(--tarjeta)}
.grupo-f{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.seg-f{padding:8px}
.resumen{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cifra{border:0;background:var(--tarjeta);border-radius:20px;padding:12px 10px 10px;min-height:0}
.cifra.pend{display:block;background:var(--cont)}
.cifra b{font-size:24px;font-weight:700}
.cifra span{font-size:11.5px;font-weight:500;white-space:nowrap}
.cifra.bajo{background:var(--alerta-suave)}.cifra.bajo span{color:var(--alerta-txt)}
.cifra.agot{background:var(--rojo-suave)}.cifra.agot span{color:#8C1D18}
.cifra.pend b,.cifra.pend span{color:var(--cont-txt)}
.cifra[aria-pressed="true"]{outline:2px solid var(--vino);outline-offset:2px}
/* Artículos: color propio para distinguirlo de las demás fichas */
.cifra:not(.bajo):not(.agot):not(.pend){background:var(--vino)}
.cifra:not(.bajo):not(.agot):not(.pend) b,.cifra:not(.bajo):not(.agot):not(.pend) span{color:#fff}
.cifra:not(.bajo):not(.agot):not(.pend) .ic{background:rgba(255,255,255,.18);color:#fff}
/* Agotados: late suave mientras haya artículos agotados */
.cifra.agot.latiendo{animation:latidoFicha 2.4s ease-in-out infinite}
@keyframes latidoFicha{0%,100%{transform:scale(1);background:var(--rojo-suave);box-shadow:0 0 0 0 rgba(179,38,30,0)}50%{transform:scale(1.04);background:#F9D5D2;box-shadow:0 0 0 6px rgba(179,38,30,.12)}}
.chips{-webkit-mask-image:none;mask-image:none;flex-wrap:wrap;overflow:visible;margin:4px 0 0;padding:0}
.chip{min-height:36px;border:1px solid var(--linea);background:var(--fondo);font-weight:500;border-radius:18px;transition:background 350ms var(--m3),transform 150ms var(--m3)}
.chip[aria-pressed="true"]{background:var(--cont);border-color:var(--cont);color:var(--cont-txt);font-weight:600}
.chip[aria-pressed="true"] .n{background:rgba(59,7,19,.1)}
.seccion{display:flex;align-items:center;justify-content:space-between;margin:14px 8px 0;font-size:15px;font-weight:600;color:var(--vino)}
.seccion small{font-weight:400;font-size:13px}

/* Filas agrupadas (3 px entre filas, puntas de 28 px) */
.lista{gap:3px}
.lista>*{border-radius:6px}
.lista>:first-child,.lista>.seccion+*{border-top-left-radius:28px;border-top-right-radius:28px}
.lista>:last-child,.lista>:has(+.seccion){border-bottom-left-radius:28px;border-bottom-right-radius:28px}
.lista>.seccion{border-radius:0}
.lista>.vacio{border-radius:28px;background:var(--tarjeta)}
.art{border:0;background:var(--tarjeta);padding:12px 16px 12px 12px;min-height:80px;overflow:visible;gap:14px;transition:background 200ms}
.art::before{display:none}
.foto-mini{width:56px;height:56px;border-radius:16px;background:var(--linea-suave)}
.art .nom{font-size:16px;font-weight:500}
.art .cant b{font-size:26px;font-weight:700;color:var(--tinta)}
.art.e-bajo .cant b{color:var(--alerta-txt)}.art.e-agot .cant b{color:var(--rojo)}
.est-chip{margin-top:8px;display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:13px;font-size:12.5px;font-weight:600}
.est-chip.ok{background:var(--ok-suave);color:var(--ok-txt)}
.est-chip.bajo{background:var(--alerta-suave);color:var(--alerta-txt)}
.est-chip.agot{background:var(--rojo-suave);color:var(--rojo)}
/* Agotado: late suave para que se note que hay que pedirlo */
.art.e-agot{animation:latido 2.4s ease-in-out infinite}
.art.e-agot .est-chip{animation:latidoChip 2.4s ease-in-out infinite}
@keyframes latido{0%,100%{background:var(--tarjeta)}50%{background:#FADCDA}}
@keyframes latidoChip{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(179,38,30,0)}50%{transform:scale(1.06);box-shadow:0 0 0 5px rgba(179,38,30,.12)}}

/* Navegación con pastilla */
.nav{background:var(--tarjeta);border-top:0;padding:0 4px env(safe-area-inset-bottom)}
.tab{min-height:80px;gap:4px;font-size:12px;font-weight:500;color:var(--tinta)}
.tab .pill{position:relative;width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:width 300ms var(--m3),background 300ms var(--m3)}
.tab[aria-current="page"]{color:var(--tinta);font-weight:700}
.tab[aria-current="page"] .pill{width:64px;background:var(--cont);color:var(--cont-txt)}
.tab .mas{display:none}
.tab .badge{top:-6px;left:auto;right:-10px;background:var(--rojo);border-radius:9px;min-width:18px;height:18px;padding:0 5px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* El número de pendientes late suave para que se note la alerta */
.badge.late-suave{animation:latidoBadge 1.8s ease-in-out infinite}
.badge.late-suave.salta{animation:salta 400ms var(--ease-out),latidoBadge 1.8s ease-in-out 400ms infinite}
@keyframes latidoBadge{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(179,38,30,.45)}50%{transform:scale(1.12);box-shadow:0 0 0 6px rgba(179,38,30,0)}}

/* Botones */
.btn{border-radius:28px;min-height:56px;font-weight:600;font-size:15.5px}
.btn.sec{background:var(--cont);color:var(--cont-txt);border:0}
.btn.verde{background:var(--verde-btn);color:#fff}
.btn.chico{min-height:48px;border-radius:24px;font-size:14.5px}
.btn.peligro{border-radius:28px}
.barra-inf{background:var(--fondo);border-top:0}
.agregar{border-radius:20px;background:var(--cont);color:var(--cont-txt);font-weight:600}

/* Detalle */
.foto-grande{border-radius:28px;border:0;background:var(--tarjeta)}
.foto-grande .acciones .btn{border-radius:20px;min-height:40px}
.kicker{font-weight:600;letter-spacing:.02em;text-transform:none;font-size:15px;color:var(--vino)}
.titulo-art{font-weight:700;font-size:26px}
.dato{border:0;background:var(--tarjeta);border-radius:20px}
.dato b{font-weight:700}
.dato.editable{border:1px dashed var(--linea)}
.aviso{border-radius:16px;font-weight:500}
.movs{padding:6px 20px 10px}
.movs h2{font-size:15px;font-weight:600;color:var(--vino)}
.mov{border-top-color:var(--linea-suave)}
.mov .ico{border-radius:20px;width:40px;height:40px}

/* Formulario */
.inp{border:1px solid var(--linea);border-radius:16px;min-height:52px}
.inp:focus{box-shadow:0 0 0 3px var(--cont)}
.lbl{font-weight:500}
.segmento{background:var(--tarjeta);border-radius:28px;padding:8px;gap:6px}
.segmento button{min-height:48px;border-radius:24px;color:var(--tinta);font-weight:600;transition:background 350ms var(--m3),color 350ms var(--m3)}
.segmento button[aria-checked="true"]{background:var(--vino);font-weight:600}
.opcion{border:1px solid var(--linea);background:var(--fondo);border-radius:22px;font-weight:500;transition:background 350ms var(--m3)}
.opcion[aria-pressed="true"],.opcion[aria-checked="true"]{font-weight:600}
.estado2{gap:6px}
.estado2 button{border:0;border-radius:24px;background:transparent;font-weight:600;transition:background 350ms var(--m3)}
.estado2 button.pend[aria-checked="true"]{border:0;background:var(--alerta-suave)}
.estado2 button.inst[aria-checked="true"]{border:0;background:var(--ok-suave)}
.items{padding:6px 16px 12px}
.items{display:flex;flex-direction:column}
/* El título ya está arriba de la tarjeta: se oculta solo el texto, el botón Agregar queda al final de la lista */
.items .top{order:2;padding:0}.items .top b{display:none}
.linea{border-top:1px solid var(--linea-suave);padding:12px 0}
.linea:first-of-type{border-top:0}
.paso{border:0;border-radius:20px;background:var(--linea-suave);color:var(--tinta)}
.paso[data-d="1"]{background:var(--cont);color:var(--cont-txt)}
.num{border:1px solid var(--linea);border-radius:14px;background:#fff}
.items .agregar{width:100%;justify-content:center;min-height:48px;margin-top:6px;border-radius:24px}
.check input{accent-color:var(--vino)}

/* Pendientes e historial */

.tk{padding:18px 20px;gap:12px}
.tk .d{font-size:17px;font-weight:500}
.tk .tag{height:26px}
.tk .bts .btn{font-size:14px;padding:0 10px;gap:6px;white-space:nowrap}
.hist{border:0;background:var(--tarjeta);padding:14px 16px;min-height:72px}
.hist .d{font-weight:500}
.fecha-sec{font-weight:600;color:var(--vino);font-size:15px;margin:14px 8px 0}
.lista>.fecha-sec{border-radius:0}
.lista>.fecha-sec+*{border-top-left-radius:28px;border-top-right-radius:28px}
.lista>:has(+.fecha-sec){border-bottom-left-radius:28px;border-bottom-right-radius:28px}

/* Hojas, acceso y avisos */
.hoja{background:var(--fondo);border-radius:28px 28px 0 0}
.hoja .h-cab{border-bottom:0}
.hoja .h-cab h2{font-weight:700;font-size:20px}
.hoja .h-cab button{border-radius:24px;background:var(--linea-suave)}
.hoja .h-pie{border-top:0}
.acceso img{border-radius:0;object-fit:contain}
.acceso h1{font-weight:700;font-size:28px}
.toast{background:#382E2F;color:#FCEBEC;border-radius:16px;font-weight:500}
.snack{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:42;background:#382E2F;color:#FCEBEC;border-radius:16px;padding:14px 8px 6px 16px;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity 200ms var(--m3),transform 450ms var(--m3in);max-width:560px;margin:auto}
.snack.on{opacity:1;transform:none;pointer-events:auto}
.snack b{display:flex;align-items:center;gap:8px;font-size:15px}.snack b .i{width:20px;height:20px;color:#FFB3BB}
.snack p{margin:4px 8px 0 28px;font-size:14px;line-height:1.45;color:#E8D5D7}
.snack .sa{display:flex;justify-content:flex-end;gap:4px;margin-top:4px}
.snack .sa button{border:0;background:none;color:#FFB3BB;font-size:14px;font-weight:700;min-height:44px;padding:0 12px;border-radius:20px}

/* PC */
@media (min-width:1024px){
  .cab.est{padding:24px 28px 4px}
  .cab.est .logo{display:none}
  .cab.est h1{margin-top:18px}
  .cab.est .buscar{width:auto;max-width:560px}
  .cab.inv{display:block}
  .nav{background:var(--tarjeta);border-right:0;padding:20px 12px}
  .tab{min-height:56px;border-radius:28px;font-size:15px;gap:12px;padding:0 16px 0 4px}
  .tab:hover{background:var(--linea-suave)}
  .tab[aria-current="page"]{background:var(--cont);color:var(--cont-txt)}
  .tab[aria-current="page"] .pill{width:32px;background:none}
  .tab.tab-mov{order:-1;background:var(--vino);color:#fff;margin-bottom:12px;font-weight:600}
  .tab.tab-mov:hover{background:var(--vino-osc)}
  .tab .badge{position:absolute;top:-4px;right:-6px}
  .marca img{border:0;padding:0;border-radius:0;object-fit:contain}

  .cuerpo{padding:16px 28px 40px}
  .lista{display:flex}
  .snack{bottom:28px;left:calc(220px + 28px);right:28px}
  .cuerpo:has(>.items){display:flex}
  .cifra.pend{display:flex}
  .cab.est .franja{order:0}
  .cab.est .franja.espera,.cab.est .franja.error,.cab.est .franja.sube{order:2}
}
@media (prefers-reduced-motion:reduce){.snack{transform:none}}
